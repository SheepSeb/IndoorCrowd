[project]
name = "yet-another-person-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.13.0.92",
    "transformers>=4.47.0,<5",
    "gradio>=4.0.0",
    "accelerate>=0.20.0",
    "pycocotools>=2.0.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "matplotlib>=3.10.8",
    "python-dotenv>=1.0.0",
    "ultralytics>=8.0.0",
    "tqdm>=4.66.0",
    "autodistill-grounded-edgesam>=0.1.0",
    "autodistill-grounded-sam>=0.1.0",
    "autodistill-grounding-dino>=0.1.0",
    "scikit-learn>=1.0.0",
    "roboflow>=1.0.0",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
